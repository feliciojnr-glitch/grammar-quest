<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Handmade Grammar Quest</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@500;700;800&display=swap">
<style>
/* Layout: one-screen kids game — HUD on top, a map of two worlds (Kitchen / Origami) + final test, and a big play card per question. Single bright look by choice, palette echoing the chapter (teal, navy, sun, coral). */
:root{
  --sky:#E8F6F4; --ink:#173044; --muted:#55697A; --card:#FFFFFF; --line:#D5E4E2;
  --teal:#168A8C; --teal-dark:#0E6466; --teal-soft:#DDF1EF;
  --sun:#F3B93F; --sun-soft:#FFF2D3; --coral:#E9785C; --coral-soft:#FCE4DC;
  --navy:#173044; --grape:#6A4CD6; --grape-soft:#ECE6FF; --good:#2E9B4F; --good-soft:#DFF5E5; --bad:#C8442B;
  --display:"Baloo 2","Trebuchet MS",system-ui,sans-serif;
  --body:"Nunito","Segoe UI",system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--sky);color:var(--ink);font-family:var(--body);font-size:18px;line-height:1.45;
  background-image:radial-gradient(circle at 8% 12%,#fff 0 70px,transparent 71px),radial-gradient(circle at 92% 6%,#fff 0 50px,transparent 51px)}
button{font-family:inherit;cursor:pointer;border:0;color:inherit}
button:focus-visible,input:focus-visible{outline:4px solid var(--grape);outline-offset:3px}
.wrap{max-width:980px;margin:0 auto;padding-block:20px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--display);line-height:1.05;margin:0;text-wrap:balance}

.hud{display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:var(--card);border-radius:22px;padding:12px 18px;box-shadow:0 6px 0 var(--line);margin-bottom:22px}
.who{display:flex;align-items:center;gap:10px;font-weight:800;min-width:0}
.ava{font-size:34px;width:52px;height:52px;display:grid;place-items:center;background:var(--teal-soft);border-radius:16px}
.lvl{font-size:13px;color:var(--muted);font-weight:800;letter-spacing:.05em;text-transform:uppercase}
.xpbar{flex:1;min-width:140px;height:14px;background:var(--teal-soft);border-radius:99px;overflow:hidden}
.xpbar i{display:block;height:100%;background:linear-gradient(90deg,var(--teal),var(--sun));width:0;transition:width .6s}
.pill{display:flex;align-items:center;gap:6px;background:var(--sun-soft);padding:6px 14px;border-radius:99px;font-weight:800;font-variant-numeric:tabular-nums}
.pill.combo{background:var(--coral-soft)}
.iconbtn{background:var(--sky);border-radius:14px;padding:8px 14px;font-weight:800}

.home{text-align:center;background:var(--card);border-radius:32px;padding:40px 28px;box-shadow:0 10px 0 var(--line)}
.home h1{font-size:clamp(40px,7vw,66px);color:var(--teal)}
.home .sub{color:var(--muted);font-size:20px;margin:10px auto 26px;max-width:560px}
.avatars{display:flex;flex-wrap:wrap;justify-content:center;gap:12px;margin:18px 0 22px}
.avatars button{font-size:40px;width:76px;height:76px;border-radius:22px;background:var(--sky);border:4px solid transparent;transition:transform .15s}
.avatars button[aria-pressed="true"]{border-color:var(--teal);background:var(--teal-soft);transform:scale(1.08)}
.name-in{font:inherit;font-size:24px;font-weight:800;text-align:center;padding:14px 18px;border-radius:18px;border:3px solid var(--line);width:min(360px,100%)}
.big{font-family:var(--display);font-size:24px;font-weight:800;padding:13px 30px;border-radius:20px;background:var(--teal);color:#fff;box-shadow:0 6px 0 var(--teal-dark);transition:transform .1s}
.big:active{transform:translateY(4px);box-shadow:0 2px 0 var(--teal-dark)}
.big.sun{background:var(--sun);color:var(--ink);box-shadow:0 6px 0 #C38E1E}
.big.ghost{background:var(--card);color:var(--teal);box-shadow:0 6px 0 var(--line)}
.big:disabled{opacity:.4;cursor:not-allowed}

.world{background:var(--card);border-radius:28px;padding:24px;margin-bottom:22px;box-shadow:0 8px 0 var(--line)}
.world-head{display:flex;align-items:center;gap:14px;margin-bottom:18px;flex-wrap:wrap}
.emb{font-size:40px;width:64px;height:64px;display:grid;place-items:center;border-radius:20px}
.world-head h2{font-size:32px}
.world-head p{margin:0;color:var(--muted);font-weight:700}
.w1 .emb{background:var(--sun-soft)} .w1 h2{color:#A86E00}
.w2 .emb{background:var(--grape-soft)} .w2 h2{color:var(--grape)}
.stages{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:14px}
.stage{background:var(--sky);border-radius:22px;padding:16px;text-align:left;display:flex;flex-direction:column;gap:6px;border:3px solid transparent;transition:transform .15s}
.stage:hover:not(:disabled){transform:translateY(-4px);border-color:var(--teal)}
.stage .ic{font-size:38px}
.stage b{font-family:var(--display);font-size:21px;line-height:1.1}
.stage small{color:var(--muted);font-weight:700;font-size:14px}
.stage .st{font-size:20px;letter-spacing:2px}
.stage:disabled{opacity:.5;cursor:not-allowed;filter:grayscale(.7)}
.stage.done{background:var(--good-soft)}
.boss{background:linear-gradient(135deg,#173044,#168A8C);color:#fff;border-radius:28px;padding:26px;display:flex;align-items:center;gap:20px;flex-wrap:wrap;box-shadow:0 8px 0 #0C2030}
.boss .ic{font-size:64px}
.boss h2{font-size:34px}
.boss p{margin:4px 0 0;opacity:.9;font-weight:700}
.boss .big{margin-left:auto}
.badges{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px}
.badge{background:var(--card);border-radius:99px;padding:8px 16px;font-weight:800;box-shadow:0 4px 0 var(--line)}
.badge.off{opacity:.45}
.footer-row{display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px;margin-top:22px;color:var(--muted);font-size:14px;font-weight:700}
.linkish{background:none;color:var(--muted);text-decoration:underline;font-weight:700;padding:4px}

.play{background:var(--card);border-radius:32px;padding:26px 28px 32px;box-shadow:0 10px 0 var(--line)}
.play-top{display:flex;align-items:center;gap:10px;margin-bottom:16px;flex-wrap:wrap}
.play-top h2{font-size:27px;flex:1;min-width:0}
.prog{height:12px;background:var(--sky);border-radius:99px;overflow:hidden;margin-bottom:22px}
.prog i{display:block;height:100%;background:var(--teal);width:0;transition:width .4s}
.rule{display:flex;gap:14px;align-items:flex-start;background:var(--grape-soft);border-radius:20px;padding:14px 18px;margin-bottom:20px;font-weight:700}
.rule .r-ic{font-size:30px;line-height:1}
.rule b{color:var(--grape)}
.q-emoji{font-size:clamp(60px,12vw,100px);text-align:center;line-height:1.1;margin:4px 0 10px}
.q-text{font-family:var(--display);font-size:clamp(24px,4vw,34px);text-align:center;font-weight:700;max-width:760px;margin:0 auto 8px}
.blank{display:inline-block;min-width:110px;border-bottom:4px dashed var(--teal);color:var(--teal)}
.q-hint{text-align:center;color:var(--muted);font-weight:700;margin:0 0 18px}
.speak{display:flex;justify-content:center;margin-bottom:18px}
.speak button{background:var(--teal-soft);color:var(--teal-dark);font-weight:800;border-radius:99px;padding:9px 18px;font-size:16px}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;max-width:780px;margin:0 auto}
.opt{background:var(--sky);border:3px solid var(--line);border-radius:20px;padding:16px 14px;font-size:21px;font-weight:800;font-family:var(--display);transition:transform .1s}
.opt:hover:not(:disabled){transform:translateY(-3px);border-color:var(--teal)}
.opt.ok{background:var(--good);border-color:#217A3C;color:#fff;animation:pop .35s}
.opt.no{background:var(--coral-soft);border-color:var(--bad);color:var(--bad);text-decoration:line-through;animation:shake .35s}
.opt:disabled{cursor:default}
.bins{display:grid;grid-template-columns:1fr 1fr;gap:16px;max-width:680px;margin:0 auto}
.bin{border-radius:24px;padding:20px 12px;font-family:var(--display);font-size:24px;font-weight:800;border:4px dashed}
.bin .bi{font-size:44px;display:block}
.bin.a{background:var(--good-soft);border-color:var(--good);color:#1F6B37}
.bin.b{background:var(--coral-soft);border-color:var(--coral);color:#9A3520}
.bin.ok{border-style:solid;background:var(--good);border-color:#217A3C;color:#fff;animation:pop .35s}.bin.no{animation:shake .35s;opacity:.6}
.word-card{background:var(--navy);color:#fff;font-family:var(--display);font-weight:800;font-size:clamp(22px,4vw,30px);border-radius:22px;padding:18px 24px;max-width:640px;margin:0 auto 22px;text-align:center;box-shadow:0 6px 0 #0C2030;animation:drop .4s}
.explain{max-width:760px;margin:20px auto 0;border-radius:20px;padding:16px 20px;font-size:18px}
.explain.good{background:var(--good-soft);color:#1F6B37}
.explain.bad{background:var(--coral-soft);color:#7A2A1A;border:3px solid var(--coral)}
.explain b{font-weight:800}
.explain .ttl{font-family:var(--display);font-size:22px;font-weight:800;display:block;margin-bottom:4px}
.navrow{display:flex;justify-content:space-between;gap:12px;margin-top:22px;flex-wrap:wrap}
.navrow .big{font-size:20px;padding:11px 22px}

/* order game */
.recipe-title{text-align:center;font-family:var(--display);font-size:28px;font-weight:800;margin-bottom:6px}
.slots{display:flex;flex-direction:column;gap:10px;max-width:720px;margin:0 auto 18px}
.slot{min-height:56px;border:3px dashed var(--line);border-radius:18px;padding:12px 16px;display:flex;gap:10px;align-items:center;color:var(--muted);font-weight:700}
.slot.fill{border-style:solid;border-color:var(--good);background:var(--good-soft);color:var(--ink);animation:pop .3s}
.slot .n{font-family:var(--display);font-weight:800;color:var(--teal);font-size:22px;width:26px;flex:none}
.pile{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;max-width:820px;margin:0 auto}
.step{background:var(--sun-soft);border:3px solid var(--sun);border-radius:18px;padding:12px 16px;font-weight:800;font-size:18px;text-align:left;max-width:360px;transition:transform .1s}
.step:hover{transform:translateY(-3px)}
.step.no{animation:shake .35s;border-color:var(--bad);background:var(--coral-soft)}
.step .cn{color:var(--grape);text-decoration:underline;text-decoration-thickness:3px}

.timer{font-family:var(--display);font-size:26px;font-weight:800;background:var(--coral-soft);color:var(--bad);border-radius:16px;padding:2px 14px}
.result{text-align:center}
.result .stars{font-size:70px;letter-spacing:8px;margin:12px 0}
.result .stars span{display:inline-block;animation:pop .5s both}
.result h2{font-size:42px;color:var(--teal)}
.result p{color:var(--muted);font-weight:700;font-size:20px}
.row{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;margin-top:22px}
.review{text-align:left;max-width:760px;margin:20px auto 0;background:var(--sun-soft);border-radius:20px;padding:16px 20px}
.review li{margin-bottom:10px}
.cert{background:var(--card);border-radius:32px;padding:40px 30px;text-align:center;border:10px solid var(--sun);box-shadow:0 10px 0 var(--line)}
.cert h1{font-size:clamp(34px,6vw,54px);color:var(--teal)}
.cert .nm{font-family:var(--display);font-size:clamp(32px,6vw,50px);border-bottom:4px dashed var(--sun);display:inline-block;padding:0 20px;margin:12px 0}

.toast{position:fixed;left:50%;top:calc(20px + env(safe-area-inset-top,0px));transform:translateX(-50%) translateY(-160%);background:var(--ink);color:#fff;font-weight:800;padding:14px 24px;border-radius:18px;z-index:50;transition:transform .35s;max-width:calc(100% - 32px);text-align:center}
.toast.show{transform:translateX(-50%) translateY(0)}
.floatpts{position:fixed;font-family:var(--display);font-weight:800;font-size:30px;color:var(--good);pointer-events:none;z-index:40;animation:rise 1s forwards}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:45}
@keyframes pop{0%{transform:scale(.7)}60%{transform:scale(1.1)}100%{transform:scale(1)}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
@keyframes rise{from{opacity:1;transform:translateY(0)}to{opacity:0;transform:translateY(-70px)}}
@keyframes drop{from{opacity:0;transform:translateY(-30px)}to{opacity:1;transform:none}}
@media (max-width:560px){.play{padding:22px 16px 26px}.boss .big{margin-left:0}.bin{font-size:19px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
<style>[hidden]{display:none!important}</style>
</head>
<body>

<canvas id="confetti"></canvas>
<div class="toast" id="toast"></div>
<div class="wrap" id="app"></div>

<script>
/* ================= CONTEÚDO — Chapter 10 Handmade Culture · foco em GRAMÁTICA ================= */
const R_SEQ='<b>Sequencers</b> mostram a ordem dos passos. 🟢 Começo: <b>First, To start, To begin</b> · 🟡 Meio: <b>Next, Then, After that, Later</b> · 🔴 Fim: <b>Finally, At last, In the end</b>';
const R_IMP='<b>Imperative</b> = dar uma ordem ou instrução. Começa direto com o <b>verbo</b>, sem "I, you, she": <b>Fold</b> the paper. <b>Mix</b> the eggs.';
const R_NEG='<b>Negativo do imperativo:</b> <b>Don\'t + verbo</b>. Fold → <b>Don\'t fold</b>. O verbo NÃO muda: nunca "Don\'t folds".';
const POS=['🟢 Beginning','🟡 Middle','🔴 End'];

const STAGES=[
/* ---------- MUNDO 1: KITCHEN ---------- */
{id:'k1',world:1,icon:'🚦',title:'Sequencer Lights',sub:'Começo, meio ou fim?',type:'quiz',rule:R_SEQ,intro:'Cada palavra mostra um momento da receita. Ela é de COMEÇO, MEIO ou FIM?',
 items:[
  {e:'🥇',q:'First',o:POS,a:'🟢 Beginning',why:'"First" = primeiro. É sempre o começo.'},
  {e:'🏁',q:'Finally',o:POS,a:'🔴 End',why:'"Finally" = finalmente. Fecha a receita.'},
  {e:'➡️',q:'Then',o:POS,a:'🟡 Middle',why:'"Then" = então / depois. Fica no meio.'},
  {e:'⏭️',q:'Next',o:POS,a:'🟡 Middle',why:'"Next" = em seguida. Fica no meio.'},
  {e:'🚀',q:'To start',o:POS,a:'🟢 Beginning',why:'"To start" = para começar.'},
  {e:'🔜',q:'After that',o:POS,a:'🟡 Middle',why:'"After that" = depois disso. Precisa de algo ANTES, então é meio.'},
  {e:'🎬',q:'In the end',o:POS,a:'🔴 End',why:'"In the end" = no final.'},
  {e:'🕒',q:'Later',o:POS,a:'🟡 Middle',why:'"Later" = mais tarde. Fica no meio.'},
  {e:'🎉',q:'At last',o:POS,a:'🔴 End',why:'"At last" = por fim.'},
  {e:'🌅',q:'To begin',o:POS,a:'🟢 Beginning',why:'"To begin" = para começar.'}
 ]},
{id:'k2',world:1,icon:'🧑‍🍳',title:'Recipe Builder',sub:'Monte a receita na ordem',type:'order',rule:R_SEQ,intro:'Toque nos passos na ORDEM CERTA. Use as palavras sublinhadas como pista!',
 rounds:[
  {name:'🥪 Cheese Sandwich',steps:['<span class="cn">First</span>, take two slices of bread.','<span class="cn">Then</span>, put cheese on one slice.','<span class="cn">After that</span>, add some tomato.','<span class="cn">Finally</span>, put the other slice on top. Enjoy!']},
  {name:'🍚 Cuscuz (Northeast Brazil)',steps:['<span class="cn">To start</span>, put the cuscuz in a bowl.','<span class="cn">Next</span>, add water and salt.','<span class="cn">Then</span>, mix and let it rest for 10 minutes.','<span class="cn">After that</span>, take it to the microwave for 3 minutes.','<span class="cn">In the end</span>, eat it with butter or egg!']},
  {name:'🐸 Origami Frog',steps:['<span class="cn">First</span>, take a square sheet of paper.','<span class="cn">Next</span>, fold the paper in half.','<span class="cn">After that</span>, bring both sides to the middle.','<span class="cn">Finally</span>, push the back and watch your frog jump!']}
 ]},
{id:'k3',world:1,icon:'🧩',title:'Missing Word',sub:'Complete com o sequencer',type:'quiz',rule:R_SEQ,intro:'Escolha o sequencer que combina com a frase.',
 items:[
  {e:'🧼',q:'___, wash your hands. (passo 1)',o:['First','Finally','After that'],a:'First',why:'É o primeiro passo, então usa "First".'},
  {e:'🥚',q:'Break the eggs. ___, add the sugar.',o:['Then','First','In the end'],a:'Then',why:'Vem depois de outro passo: meio → "Then".'},
  {e:'🍰',q:'___, eat your cake! (último passo)',o:['Finally','Next','To start'],a:'Finally',why:'Último passo → "Finally".'},
  {e:'🥣',q:'Mix the flour. ___ that, add milk.',o:['After','Before','First'],a:'After',why:'A expressão é "After that" (depois disso).'},
  {e:'🍳',q:'___ start, heat the pan.',o:['To','At','In'],a:'To',why:'A expressão é "To start" (para começar).'},
  {e:'🍽️',q:'In the ___, serve the food.',o:['end','first','next'],a:'end',why:'A expressão é "In the end" (no final).'},
  {e:'🍫',q:'Melt the chocolate. ___, put it in the fridge.',o:['Next','First','To begin'],a:'Next',why:'Passo do meio → "Next".'},
  {e:'🧃',q:'Which word can NOT start a recipe?',o:['Finally','First','To begin'],a:'Finally',why:'"Finally" só aparece no fim, nunca no começo.'}
 ]},
{id:'k4',world:1,icon:'🥣',title:'Kitchen Commands',sub:'Verbos de receita',type:'quiz',rule:R_IMP,intro:'Receitas usam verbos de COMANDO. Qual verbo combina com o desenho?',
 items:[
  {e:'🥄🥣',q:'___ the eggs and the sugar.',o:['Mix','Fry','Cut'],a:'Mix',why:'Mix = misturar.'},
  {e:'➕🧂',q:'___ some salt.',o:['Add','Wash','Bake'],a:'Add',why:'Add = adicionar.'},
  {e:'🍳🔥',q:'___ the acarajé in dendê oil.',o:['Fry','Mix','Serve'],a:'Fry',why:'Fry = fritar (o acarajé é frito no dendê).'},
  {e:'🎂♨️',q:'___ the cake in the oven.',o:['Bake','Fry','Cut'],a:'Bake',why:'Bake = assar no forno.'},
  {e:'🔪🍅',q:'___ the tomatoes.',o:['Cut','Blend','Add'],a:'Cut',why:'Cut = cortar.'},
  {e:'🌀🥜',q:'___ the peanuts in a blender.',o:['Blend','Wash','Bake'],a:'Blend',why:'Blend = bater no liquidificador.'},
  {e:'🍽️😋',q:'___ the food to your family.',o:['Serve','Fry','Cut'],a:'Serve',why:'Serve = servir.'},
  {e:'💧🥕',q:'___ the vegetables.',o:['Wash','Bake','Blend'],a:'Wash',why:'Wash = lavar.'}
 ]},
/* ---------- MUNDO 2: ORIGAMI ---------- */
{id:'o1',world:2,icon:'📣',title:'Command or Not?',sub:'É imperativo?',type:'sort',rule:R_IMP,intro:'Leia a frase e jogue no balde certo: É UM COMANDO ou NÃO É?',
 bins:['📣 COMMAND','🚫 NOT A COMMAND'],
 items:[
  {s:'Fold the paper.',a:0,why:'Começa com o verbo "Fold" e dá uma ordem → imperativo.'},
  {s:'She folds the paper.',a:1,why:'Tem sujeito (She) e o verbo ganhou -s → simple present, não é comando.'},
  {s:'Don\'t throw away the recipe.',a:0,why:'Don\'t + verbo = comando negativo.'},
  {s:'She makes crafts with golden grass.',a:1,why:'Conta um fato sobre ela (She makes) → não é comando.'},
  {s:'Present your ideas to the class.',a:0,why:'Começa com o verbo "Present" → comando.'},
  {s:'You are going to make an origami.',a:1,why:'Tem sujeito (You) e "are going to" = futuro → não é comando.'},
  {s:'Add sugar and mix.',a:0,why:'Add e mix são instruções → imperativo.'},
  {s:'My grandma cooks acarajé.',a:1,why:'Conta um fato (My grandma cooks) → não é comando.'},
  {s:'Turn it over.',a:0,why:'Começa com o verbo "Turn" → comando.'},
  {s:'I love origami.',a:1,why:'Tem sujeito (I) e fala de gosto → não é comando.'}
 ]},
{id:'o2',world:2,icon:'🙅',title:'Don\'t!',sub:'Imperativo negativo',type:'quiz',rule:R_NEG,intro:'Transforme o comando em NEGATIVO.',
 items:[
  {e:'📄',q:'Fold the paper. → ___',o:['Don\'t fold the paper.','Not fold the paper.','Don\'t folds the paper.'],a:'Don\'t fold the paper.',why:'Don\'t + verbo sem mudança: Don\'t fold.'},
  {e:'🪟',q:'Open the window. → ___',o:['No open the window.','Don\'t open the window.','Doesn\'t open the window.'],a:'Don\'t open the window.',why:'No imperativo o negativo é sempre Don\'t (nunca No ou Doesn\'t).'},
  {e:'🔄',q:'Turn it over. → ___',o:['Don\'t turn it over.','Don\'t turns it over.','Not turn it over.'],a:'Don\'t turn it over.',why:'Depois de Don\'t o verbo não ganha -s.'},
  {e:'🏃',q:'Run in the kitchen! → ___',o:['Don\'t run in the kitchen!','Not run in the kitchen!','You not run in the kitchen!'],a:'Don\'t run in the kitchen!',why:'Don\'t + run.'},
  {e:'🗑️',q:'Throw away the food. → ___',o:['Don\'t throw away the food.','Don\'t throwing away the food.','No throw away the food.'],a:'Don\'t throw away the food.',why:'Don\'t + verbo na forma base (throw, sem -ing).'},

let AC=null;
function tone(f,d,t='sine',w=0,v=.18){try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain();o.type=t;o.frequency.value=f;g.gain.setValueAtTime(v,AC.currentTime+w);g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+w+d);o.connect(g);g.connect(AC.destination);o.start(AC.currentTime+w);o.stop(AC.currentTime+w+d)}catch(e){}}
const sfx={ok(){tone(660,.15,'triangle');tone(990,.22,'triangle',.1)},no(){tone(180,.3,'sawtooth',0,.1)},win(){[523,659,784,1046].forEach((f,i)=>tone(f,.3,'triangle',i*.12))},tap(){tone(420,.07,'square',0,.06)},lvl(){[392,523,659,784,1046].forEach((f,i)=>tone(f,.25,'square',i*.09,.08))}};
let voice=null;function pickVoice(){try{const vs=speechSynthesis.getVoices();voice=vs.find(v=>/en-US/i.test(v.lang)&&/Samantha|Google|Natural/i.test(v.name))||vs.find(v=>/^en/i.test(v.lang))||null}catch(e){}}
try{speechSynthesis.onvoiceschanged=pickVoice;pickVoice()}catch(e){}
function say(t){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(strip(t).replace(/_{2,}/g,'blank').replace(/→/g,'. '));u.lang='en-US';u.rate=.88;if(voice)u.voice=voice;speechSynthesis.speak(u)}catch(e){}}
function toast(m){const t=document.getElementById('toast');t.innerHTML=m;t.classList.add('show');clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('show'),2300)}
function floatPts(el,txt){const r=el.getBoundingClientRect();const d=document.createElement('div');d.className='floatpts';d.textContent=txt;d.style.left=(r.left+r.width/2-30)+'px';d.style.top=(r.top-10)+'px';document.body.appendChild(d);setTimeout(()=>d.remove(),1000)}
const cv=document.getElementById('confetti'),cx=cv.getContext('2d');let parts=[],raf=0;
function confetti(n=140){cv.width=innerWidth;cv.height=innerHeight;const cols=['#168A8C','#F3B93F','#E9785C','#6A4CD6','#2E9B4F'];for(let i=0;i<n;i++)parts.push({x:innerWidth/2,y:innerHeight/3,vx:(Math.random()-.5)*16,vy:Math.random()*-14-4,s:6+Math.random()*8,c:cols[i%5],r:Math.random()*6,life:120+Math.random()*60});if(!raf)loop()}
function loop(){cx.clearRect(0,0,cv.width,cv.height);parts=parts.filter(p=>p.life-->0&&p.y<cv.height+20);parts.forEach(p=>{p.vy+=.4;p.x+=p.vx;p.y+=p.vy;p.r+=.2;cx.save();cx.translate(p.x,p.y);cx.rotate(p.r);cx.fillStyle=p.c;cx.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);cx.restore()});raf=parts.length?requestAnimationFrame(loop):0;if(!raf)cx.clearRect(0,0,cv.width,cv.height)}

 if(combo===5)toast('🔥 COMBO x5! Você está pegando fogo!');
 if(level()>before){sfx.lvl();confetti(80);toast('⭐ LEVEL UP! Agora você é Level '+level()+'!');const l=$('.lvl');if(l)l.textContent='Level '+level()}}

}

const worldDone=w=>STAGES.filter(s=>s.world===w).every(s=>S.stars[s.id]);

/* ================= MOTOR DAS FASES ================= */
function shell(title,inner){app.innerHTML=hud(true)+`<div class="play"><div class="play-top"><h2>${title}</h2><span id="extra"></span></div><div class="prog"><i id="prog"></i></div><div id="body">${inner||''}</div></div>`;bindHud();window.scrollTo(0,0)}
const setProg=(a,b)=>{const p=$('#prog');if(p)p.style.width=(a/b*100)+'%'};
const ruleBox=r=>r?`<div class="rule"><span class="r-ic">💡</span><div>${r}</div></div>`:'';
function start(stage){
 combo=0;R={stage,i:0,err:0,earned:0,ans:[],wrong:[]};
 if(stage.items)R.items=shuffle(stage.items).map(it=>Object.assign({},it,{oo:it.o?shuffle(it.o):null}));
 shell(stage.icon+' '+stage.title,`<div class="q-emoji">${stage.icon}</div><p class="q-text" style="font-size:26px">${stage.intro}</p>${ruleBox(stage.rule)}<div class="row"><button class="big" id="go">Vamos lá! ▶</button></div>`);
 $('#go').onclick=()=>({quiz:quizQ,sort:sortQ,order:orderStart})[stage.type]();
}
function navRow(onNext){
 // ← Voltar (questão anterior) · Próxima →
 const answered=R.ans[R.i]!==undefined;
 return `<div class="navrow"><button class="big ghost" id="prevQ" ${R.i===0?'disabled':''}>← Voltar</button>${answered?`<button class="big" id="nextQ">${R.i===R.items.length-1?'Terminar ✔':'Próxima →'}</button>`:''}</div>`;
}
function bindNav(render){
 const p=$('#prevQ');if(p)p.onclick=()=>{R.i--;render()};
 const n=$('#nextQ');if(n)n.onclick=()=>{R.i++;R.i<R.items.length?render():finish()};
}
function explainHtml(ok,it,picked){
 return ok?`<div class="explain good"><span class="ttl">✅ ${['Great job!','Awesome!','Correct!','Well done!'][Math.random()*4|0]}</span>${it.why}</div>`
  :`<div class="explain bad"><span class="ttl">❌ Ops! Não é "${esc(picked)}"</span>A resposta certa é <b>${esc(it.a)}</b>.<br><b>Por quê?</b> ${it.why}</div>`;
}
function record(it,picked,ok){
 if(R.ans[R.i]!==undefined)return;R.ans[R.i]={picked,ok};
 if(!ok){R.err++;R.wrong.push({q:strip(it.q||it.s),you:picked,a:it.a,why:it.why,e:it.e||''})}
}

/* quiz */
function quizQ(){
 const s=R.stage,it=R.items[R.i],done=R.ans[R.i];
 const qHtml=esc(it.q).replace('___','<span class="blank">&nbsp;?&nbsp;</span>');
 shell(s.icon+' '+s.title,`${ruleBox(s.rule)}<div class="q-emoji">${it.e}</div><p class="q-text">${qHtml}</p>
  <div class="speak"><button id="sp">🔊 Ouvir</button></div>
  <div class="opts">${it.oo.map(o=>{let c='opt';if(done){if(o===it.a)c+=' ok';else if(o===done.picked)c+=' no'}return `<button class="${c}" data-o="${esc(o)}" ${done?'disabled':''}>${esc(o)}</button>`}).join('')}</div>
  <div id="ex">${done?explainHtml(done.ok,it,done.picked):''}</div>${navRow()}`);
 $('#extra').innerHTML=`<span class="pill">${R.i+1} / ${R.items.length}</span>`;setProg(R.i+(done?1:0),R.items.length);
 $('#sp').onclick=()=>say(it.q);bindNav(quizQ);
 app.querySelectorAll('.opt:not(:disabled)').forEach(b=>b.onclick=()=>{
  const ok=b.dataset.o===it.a;record(it,b.dataset.o,ok);
  if(ok){sfx.ok();gain(10,b);say(it.q.includes('___')?it.q.replace('___',it.a).replace(/\(.*\)/,''):it.a)}else{sfx.no();miss()}
  quizQ();
  if(ok){const idx=R.i;later(()=>{if(R.i!==idx)return;if(R.i<R.items.length-1){R.i++;quizQ()}else finish()},1900)}
 });
}

/* sort into 2 bins */
function sortQ(){
 const s=R.stage,it=R.items[R.i],done=R.ans[R.i];
 shell(s.icon+' '+s.title,`${ruleBox(s.rule)}<div class="word-card" id="wc" style="${done?'animation:none':''}">"${esc(it.s)}"</div><div class="speak"><button id="sp">🔊 Ouvir</button></div>
  <div class="bins">${s.bins.map((b,k)=>{let c='bin '+(k===0?'a':'b');if(done){if(k===it.a)c+=' ok';else if(done.k===k)c+=' no'}const [ic,...w]=b.split(' ');return `<button class="${c}" data-k="${k}" ${done?'disabled':''}><span class="bi">${ic}</span>${w.join(' ')}</button>`}).join('')}</div>
  <div id="ex">${done?(done.ok?`<div class="explain good"><span class="ttl">✅ Correct!</span>${it.why}</div>`:`<div class="explain bad"><span class="ttl">❌ Ops! Essa frase é ${it.a===0?'um COMANDO':'NÃO é comando'}</span><b>Por quê?</b> ${it.why}</div>`):''}</div>${navRow()}`);
 $('#extra').innerHTML=`<span class="pill">${R.i+1} / ${R.items.length}</span>`;setProg(R.i+(done?1:0),R.items.length);
 $('#sp').onclick=()=>say(it.s);bindNav(sortQ);
 app.querySelectorAll('.bin:not(:disabled)').forEach(b=>b.onclick=()=>{
  const k=+b.dataset.k,ok=k===it.a;
  if(R.ans[R.i]===undefined){R.ans[R.i]={k,ok,picked:s.bins[k]};if(!ok){R.err++;R.wrong.push({q:it.s,you:s.bins[k],a:s.bins[it.a],why:it.why})}}
  if(ok){sfx.ok();gain(10,b);say(it.s)}else{sfx.no();miss()}
  sortQ();if(ok){const idx=R.i;later(()=>{if(R.i!==idx)return;if(R.i<R.items.length-1){R.i++;sortQ()}else finish()},1800)}
 });
}

/* order (tap steps in sequence) */
function orderStart(){R.round=0;R.items=R.stage.rounds;orderRound()}
function orderRound(){
 const s=R.stage,rd=s.rounds[R.round];R.placed=[];R.pile=shuffle(rd.steps.map((_,i)=>i));R.lastErr='';
 drawOrder();
}
function drawOrder(){
 const s=R.stage,rd=s.rounds[R.round];
 shell(s.icon+' '+s.title,`${ruleBox(s.rule)}<div class="recipe-title">${rd.name}</div><p class="q-hint">Toque no passo que vem agora.</p>
  <div class="slots">${rd.steps.map((t,i)=>R.placed[i]!==undefined?`<div class="slot fill"><span class="n">${i+1}</span><span>${rd.steps[R.placed[i]]}</span></div>`:`<div class="slot"><span class="n">${i+1}</span>${i===R.placed.length?'👉 próximo passo…':''}</div>`).join('')}</div>
  <div class="pile">${R.pile.filter(i=>!R.placed.includes(i)).map(i=>`<button class="step" data-i="${i}">${rd.steps[i]}</button>`).join('')}</div>
  <div id="ex">${R.lastErr}</div>
  <div class="navrow"><button class="big ghost" id="prevR" ${R.round===0?'disabled':''}>← Receita anterior</button><button class="big ghost" id="undo" ${R.placed.length?'':'disabled'}>↶ Desfazer passo</button></div>`);
 $('#extra').innerHTML=`<span class="pill">Receita ${R.round+1} / ${s.rounds.length}</span>`;setProg(R.round,s.rounds.length);
 $('#prevR').onclick=()=>{R.round--;orderRound()};
 $('#undo').onclick=()=>{R.placed.pop();R.lastErr='';drawOrder()};
 app.querySelectorAll('.step').forEach(b=>b.onclick=()=>{
  const i=+b.dataset.i,need=R.placed.length;
  if(i===need){R.placed.push(i);R.lastErr='';sfx.ok();gain(5,b);say(strip(rd.steps[i]));
   if(R.placed.length===rd.steps.length){drawOrder();$('#ex').innerHTML=`<div class="explain good"><span class="ttl">✅ Receita completa!</span>Viu como os sequencers mostram a ordem? ${R.round<s.rounds.length-1?'Vamos para a próxima!':''}</div>`;confetti(60);
    later(()=>{R.round++;R.round<s.rounds.length?orderRound():finish()},2200);return}
   drawOrder();
  }else{
   b.classList.add('no');sfx.no();miss();R.err++;
   const cn=(rd.steps[i].match(/class="cn">([^<]+)/)||[])[1]||'';const want=(rd.steps[need].match(/class="cn">([^<]+)/)||[])[1]||'';
   R.wrong.push({q:rd.name+' — passo '+(need+1),you:strip(rd.steps[i]),a:strip(rd.steps[need]),why:'"'+cn+'" não vem agora. O passo '+(need+1)+' começa com "'+want+'".'});
   R.lastErr=`<div class="explain bad"><span class="ttl">❌ Ainda não é esse!</span>Esse passo começa com <b>"${cn}"</b>, ${/First|To start|To begin/.test(cn)?'que é de COMEÇO':/Finally|In the end|At last/.test(cn)?'que é de FIM, então vem por último':'que é do MEIO'}. Procure o passo que vem ${need===0?'primeiro (First / To start)':'depois de "'+strip(rd.steps[need-1]).split(',')[0]+'"'}.</div>`;
   setTimeout(()=>{if(R&&R.stage===s)drawOrder()},450);
  }
 });
}

/* ================= PROVA FINAL ================= */
function bossStart(){
 combo=0;
 const fromQuiz=ids=>shuffle(STAGES.filter(s=>ids.includes(s.id)).flatMap(s=>s.items.map(it=>Object.assign({},it))));
 const fromSort=shuffle(STAGES.find(s=>s.id==='o1').items.map(it=>({e:'📣',q:'"'+it.s+'" is…',o:['a command','not a command'],a:it.a===0?'a command':'not a command',why:it.why})));
 const items=[].concat(fromQuiz(['k1']).slice(0,3),fromQuiz(['k3']).slice(0,4),fromQuiz(['k4']).slice(0,3),fromSort.slice(0,3),fromQuiz(['o2']).slice(0,3),fromQuiz(['o3','o4']).slice(0,4));
 R={stage:{id:'boss',icon:'📝',title:'Prova Final',rule:''},i:0,err:0,earned:0,ans:[],wrong:[],boss:true,items:shuffle(items).map(it=>Object.assign(it,{oo:shuffle(it.o)}))};
 shell('📝 Prova Final',`<div class="q-emoji">📝🏆</div><p class="q-text">Hora da prova!</p><p class="q-hint">20 questões sobre sequencers e imperativo. Se errar, você vê a explicação. Pode voltar para revisar. No final sai a nota de 0 a 10.</p><div class="row"><button class="big sun" id="go">Começar a prova ▶</button></div>`);
 $('#go').onclick=quizQ;
}

/* ================= RESULTADO ================= */
function finish(){
 const s=R.stage;let st,nota=null;
 const tot=s.type==='order'?s.rounds.reduce((t,r)=>t+r.steps.length,0):R.items.length;
 if(R.boss){const ok=R.ans.filter(a=>a&&a.ok).length;nota=Math.round(ok/R.items.length*100)/10;st=nota>=9?3:nota>=7?2:nota>0?1:0;S.nota=Math.max(S.nota||0,nota);R.okN=ok}
 else st=R.err===0?3:R.err<=2?2:1;
 const w1=worldDone(1),w2=worldDone(2),prev=S.stars[s.id]||0;if(st>prev)S.stars[s.id]=st;
 S.coins+=st*10;S.xp+=st*10;save();sfx.win();confetti();
 const msgs=['Continue tentando!','Bom trabalho!','Muito bem!','PERFEITO!'];
 app.innerHTML=hud(true)+`<div class="play result"><div style="font-size:60px">${st===3?'🏆':st===2?'🥈':'🎖️'}</div><h2>${msgs[st]}</h2>
  <div class="stars">${[0,1,2].map(i=>`<span style="animation-delay:${i*.2}s">${i<st?'⭐':'☆'}</span>`).join('')}</div>
  ${nota!==null?`<div style="font-family:var(--display);font-size:64px;font-weight:800;color:${nota>=7?'var(--good)':'var(--bad)'}">Nota ${nota.toFixed(1).replace('.',',')}</div><p>Você acertou <b>${R.okN}</b> de ${R.items.length} questões.</p>`:`<p>Erros: <b>${R.err}</b> · +${R.earned+st*10} 🪙</p>`}
  ${R.wrong.length?`<div class="review"><b style="font-family:var(--display);font-size:22px">📚 Vamos revisar os erros</b><ul style="padding-left:20px;margin:10px 0 0">${R.wrong.map(w=>`<li>${w.e?w.e+' ':''}${esc(w.q)}<br>❌ ${esc(w.you)} → ✅ <b>${esc(w.a)}</b><br><small>${w.why}</small></li>`).join('')}</ul></div>`:''}
  <div class="row"><button class="big ghost" id="again">🔁 Jogar de novo</button><button class="big" id="m">🗺️ Voltar ao mapa</button></div></div>`;
 bindHud();say(st===3?'Perfect! Amazing job!':'Well done!');
 $('#again').onclick=()=>R.boss?bossStart():start(s);$('#m').onclick=map;
 setTimeout(()=>{if(!w1&&worldDone(1))toast('🏅 Nova medalha: '+WORLDS[1].badge+'!');else if(!w2&&worldDone(2))toast('🏅 Nova medalha: '+WORLDS[2].badge+'!');else if(R&&R.boss&&st>0&&!prev)toast('🏆 Prova concluída! Certificado liberado.')},900);
}
function cert(){
 const total=STAGES.reduce((t,s)=>t+(S.stars[s.id]||0),0)+(S.stars.boss||0);
 app.innerHTML=hud(true)+`<div class="cert"><div style="font-size:60px">🏅</div><h1>Grammar Champion</h1><p style="font-weight:700;color:var(--muted);font-size:20px;margin-top:10px">This certificate goes to</p>
 <div class="nm">${S.ava} ${esc(S.name)}</div><p style="font-size:20px;font-weight:700;max-width:560px;margin:10px auto">for mastering <b>sequencers</b> (First, Next, Then, Finally) and the <b>imperative</b> (Fold! Don't fold!) in <i>Handmade Culture</i>.</p>
 <p style="font-size:26px">⭐ ${total} stars · 🪙 ${S.coins} coins${S.nota?' · Grade '+S.nota.toFixed(1):''}</p><p style="color:var(--muted);font-weight:700">${new Date().toLocaleDateString('pt-BR')}</p></div>`;
 bindHud();confetti(200);sfx.win();say('Congratulations '+S.name+'!');
}
S.name?map():home();
</script>
